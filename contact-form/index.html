<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Contact Form</title>
</head>
<body>

	<form action="#" method="get">

		<label for="search">Search</label>
		<input type="text" name="search" id="search">
		<button type="submit">Search</button>	
		
	</form>


	<h1 style="text-align: center;">Contact Me!</h1>
	<form action="#" method="post" style="border: 2px solid black; border-radius: 20px; margin: auto; padding: 20px;">
		<section>
			<h2 style="text-align: center;">Personal Information</h2>

			<label for="name">Full Name:</label>
			<input type="text" name="name" id="name" required><br>

			<label for="email">Email:</label>
			<input type="email" name="email" id="email" required><br>

			<label for="phone">Phone:</label>
			<input type="tel" name="phone" id="phone" required><br>
		</section>

		<section>
			<h2 style="text-align: center;">Message</h2>

			<label for="sub">Subject</label>
			<input type="text" name="sub" id="sub" required><br>

			<label for="mes">Message</label>
			<textarea id="mes" name="mes" rows="1" required></textarea>
		</section>

		<section>
			<h2 style="text-align: center;">Preferences</h2>

			<label>Contact Method:</label>
			<input type="radio" name="contact" id="ph" value="phone" required>
			<label for="ph">Phone</label>
			<input type="radio" name="contact" id="em" value="email" required>
			<label for="em">Email</label><br>

			<input
			    type="checkbox"
			    name="newsletter"
			    id="newsletter"
			    value="yes">

			<label for="newsletter">
			    Subscribe me to the newsletter
			</label>
		</section>

		<section style="text-align: center;">
			<button type="submit">
			    Send Message
			</button>
		</section>
	</form>

</body>
</html>
