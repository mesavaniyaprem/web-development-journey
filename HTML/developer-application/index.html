<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>developer-application</title></head>
<body><h1>Simple form</h1><form style="border: 2px solid black; padding: 30px; border-radius: 30px;"><fieldset><legend>Personal Information</legend><label for="name">Name</label><input type="text" name="name" id="name" autocomplete="name" required><br><label for="email">Email</label><input type="email" name="email" id="email" autocomplete="email" required><br><label for="phone">Phone</label><input type="tel" name="phone" id="phone" required><br><label for="age">Age</label><input type="number" name="age" id="age" min="18" max="100" required><br></fieldset><br><fieldset><legend>Technical Information</legend><label>Experience level</label><br><select name="experience"><option value="Beginner" selected>Beginner</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option></select><br><select name="primary_technology"><optgroup label="Frontend"><option value="HTML" selected>HTML</option><option value="CSS">CSS</option><option value="JavaScript">JavaScript</option></optgroup><optgroup label="Backend"><option value="PHP">PHP</option><option value="Laravel">Laravel</option></optgroup></select></fieldset><br><h2>Favorite Technology</h2><label for="tech">Technology you love: </label><input name="tech" id="tech" list="techs"><datalist id="techs"><option>HTML</option><option>CSS</option><option>JavaScript</option><option>PHP</option><option>Laravel</option></datalist><br><h2>About You</h2><label for="about">Tell us about yourself:</label><textarea name="about" id="about" minlength="20" maxlength="500" required></textarea><br><h2>GitHub Username</h2><label for="git">GitHub Username: </label><input type="text" name="git" id="git" maxlength="20" minlength="5" pattern="[A-Za-z0-9]+"><h2>Availability</h2><label for="date">Date</label><input type="date" name="date" id="date"><br><h3>Terms</h3><input type="checkbox" name="terms" id="terms" required><label for="terms">I agree to the terms and conditions.</label><br><br><button type="submit">Apply Now</button></form></body></html>
