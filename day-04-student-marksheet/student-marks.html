<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marksheet</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        table {
            width: 60%;
            margin: 50px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid #000;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #e6e6e6;
        }

        .title {
            font-size: 22px;
            background-color: #d9eaf7;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th colspan="5" class="title">
                    Student Marksheet - Prem Mesavaniya
                </th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th>Subject</th>
                <th>Internal</th>
                <th>External</th>
                <th>Total</th>
                <th>Grade</th>
            </tr>

            <tr>
                <td>Mathematics</td>
                <td>20</td>
                <td>70</td>
                <td>90</td>
                <td>A1</td>
            </tr>

            <tr>
                <td>Science</td>
                <td>18</td>
                <td>68</td>
                <td>86</td>
                <td>A2</td>
            </tr>

            <tr>
                <td>English</td>
                <td>19</td>
                <td>65</td>
                <td>84</td>
                <td>A2</td>
            </tr>

            <tr>
                <td>Gujarati</td>
                <td>20</td>
                <td>67</td>
                <td>87</td>
                <td>A2</td>
            </tr>

            <tr>
                <td>Social Science</td>
                <td>18</td>
                <td>66</td>
                <td>84</td>
                <td>A2</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="3">Grand Total</th>
                <th>431</th>
                <th>A2</th>
            </tr>
        </tfoot>
    </table>

</body>
</html>
