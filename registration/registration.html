<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Registration</title>
	<style>
		.form-box {
		    width: 80%;
		    padding: 20px;
		    border-radius: 10px;
		    background: white;
		    margin: 50px auto;
		    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
		}
	</style>
</head>
<body style="font-family: sans-serif; align-content: center; align-items: center;">
	<div class="form-box">
		<form action="/" method="post">
			<h1 style="text-align: center;">Personal Information</h1>
				<label for="name">Full Name</label>
				<input type="text" id="name" name="name" placeholder="Enter Your Name" required><br><br>

				<label for="email">Email</label>
				<input type="email" id="email" name="email" placeholder="Enter Your Email" required><br><br>

				<label for="password">Password</label>
				<input type="password" name="password" id="password" placeholder="Enter Your Password" required><br><br>

				<label for="phone">Phone</label>
				<input type="tel" id="phone" name="phone" placeholder="Enter Your Phone Number" required><br><br>

				<label for="dob">Date of Birth</label>
				<input type="Date" name="dob" id="dob" required><br><br>

			<label style="font-weight: bold;">Gender:</label>
				<label for="male">Male</label>
				<input type="radio" name="gender" value="male" id="male">

				<label for="female">| Female</label>
				<input type="radio" name="gender" value="female" id="female">

				<label for="other">| Prefer not to say</label>
				<input type="radio" name="gender" value="other" id="other"><br><br>

			<label style="font-weight: bold;">Skills:</label>
				<label for="html">HTML</label>
				<input type="checkbox" name="Skills" value="html" id="html">

				<label for="css">CSS</label>
				<input type="checkbox" name="Skills" value="css" id="css">

				<label for="JavaScript">JavaScript</label>
				<input type="checkbox" name="Skills" value="JavaScript" id="JavaScript">

				<label for="PHP">PHP</label>
				<input type="checkbox" name="Skills" value="PHP" id="PHP">

				<label for="Laravel">Laravel</label>
				<input type="checkbox" name="Skills" value="Laravel" id="Laravel"><br><br>

			<label for="Experience" style="font-weight: bold;">Experience:</label>
				<select id="Experience" name="Experience">
					<option>Beginner</option>
					<option>Intermediate</option>
					<option>Advanced</option>
				</select><br><br>

			<label for="about" style="font-weight: bold;">About You:</label>
				<textarea id="about" name="about" placeholder="Tell us about you here..." rows="4" cols="30"></textarea><hr>

			<label for="terms" style="font-weight: bold;">Terms and Conditions</label>
				<h4 style="color: blue;">I agree to the terms and conditions.<input type="checkbox" name="terms" id="terms" required></h4><br><br>

			<div style="text-align: center;">
				<input type="submit" id="submit" value="Create Account">
			</div>
		</form>
	</div>
</body>
</html>
